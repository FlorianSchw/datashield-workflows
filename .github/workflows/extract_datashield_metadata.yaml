name: extract DataSHIELD function metadata

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - package_list.csv
      - config/metadata_fields.yml
      - scripts/extract_metadata.R

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: install.packages(c("jsonlite", "yaml"))
        shell: Rscript {0}

      - name: Extract metadata from all listed packages
        run: Rscript scripts/extract_metadata.R package_list.csv config/metadata_fields.yml

      - name: Commit and push if the metadata changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datashield_functions_metadata
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "chore: update DataSHIELD function metadata"
            git push
          fi
